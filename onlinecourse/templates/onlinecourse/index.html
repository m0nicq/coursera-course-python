{% extends 'onlinecourse/base.html' %}{% block content %}<h1 class="mb-4">Доступные курсы</h1>{% for course in courses %}<article class="card p-4 mb-3"><h2>{{ course.name }}</h2><p>{{ course.description }}</p><a class="btn btn-primary align-self-start" href="{% url 'onlinecourse:course_details' course.id %}">Открыть курс</a></article>{% empty %}<p>Курсы пока не добавлены.</p>{% endfor %}{% endblock %}
