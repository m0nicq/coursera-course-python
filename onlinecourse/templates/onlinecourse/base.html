<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Онлайн-курс{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f7fb;color:#17253c}main{max-width:980px}.card{border:0;border-radius:14px;box-shadow:0 4px 18px #15243a0a}.navbar{background:#152b50}.badge{white-space:normal}input[type=checkbox]{width:18px;height:18px}</style>
</head><body><nav class="navbar navbar-dark px-4 py-3"><a class="navbar-brand" href="{% url 'onlinecourse:index' %}">Онлайн-курс</a><div class="text-white d-flex align-items-center gap-3">{% if user.is_authenticated %}<span>{{ user.username }}</span><form method="post" action="{% url 'onlinecourse:logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Выйти</button></form>{% else %}<a class="btn btn-outline-light btn-sm" href="{% url 'onlinecourse:login' %}">Войти</a>{% endif %}</div></nav>
<main class="container py-5">{% block content %}{% endblock %}</main></body></html>
